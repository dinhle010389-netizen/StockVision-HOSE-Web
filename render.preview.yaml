# Optional preview-only Blueprint. Free resources may sleep; free Postgres expires after 30 days.
# Do not use this Blueprint for persistent or unattended operation.
previews:
  generation: off
services:
  - type: web
    name: stockvision-hose-preview
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stockvision-db-preview
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: MARKET_DATA_PROVIDER
        value: public
      - key: PUBLIC_DATA_AUTO_SYNC_ON_STARTUP
        value: "false"
      - key: PYTHONPATH
        value: /app/backend
databases:
  - name: stockvision-db-preview
    databaseName: stockvision_preview
    user: stockvision_preview
    plan: free
    region: singapore
